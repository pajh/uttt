name: Inspect experiment run

on:
  push:
    branches:
      - experiment/inspect-run-3
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run id whose artifact should be summarized
        required: true

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download experiment artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id="$REQUESTED_RUN"
          if test -z "$run_id"; then run_id=34945301762; fi
          mkdir artifact
          gh run download "$run_id" --repo "$GH_REPO" --dir artifact

      - name: Publish CSV summaries
        run: |
          summary=$(find artifact -name summary.csv -print -quit)
          openings=$(find artifact -name openings.csv -print -quit)
          metadata=$(find artifact -name metadata.tsv -print -quit)
          test -n "$summary" && test -n "$openings" && test -n "$metadata"
          {
            echo '## Bot identity'
            echo '```text'
            cat "$metadata"
            echo '```'
            echo '## Policy results'
            echo '```csv'
            cat "$summary"
            echo '```'
            echo '## Exact opening samples'
            echo '```csv'
            cat "$openings"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
