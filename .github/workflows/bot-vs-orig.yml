name: Bot versus orig
run-name: ai_negamax versus orig — ${{ inputs.games }} games — ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      games:
        description: Total games; must be divisible by four
        required: true
        default: "1000"
      base_seed:
        description: First line seed
        required: true
        default: "20261001"
      request_id:
        description: Unique ID for matching this launch to its result
        required: false
        default: "manual"

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build the bots and rig
        run: make bin/orig ai_negamax D=0 L=0 A=0 E=1

      - name: Run four alternating-start lines
        env:
          TOTAL_GAMES: ${{ inputs.games }}
          RIG_BASE_SEED: ${{ inputs.base_seed }}
        run: |
          test $((TOTAL_GAMES % 4)) -eq 0
          export RIG_LINES=4
          export RIG_GAMES_PER_LINE=$((TOTAL_GAMES / 4))
          python3 scripts/multi-rig.py --no-interactive

      - name: Show result table
        if: always()
        run: cat reports/multi-latest.log || true

      - name: Upload result tables and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-vs-orig-${{ github.run_id }}
          path: |
            reports/
            work/multi/latest/
          retention-days: 30
