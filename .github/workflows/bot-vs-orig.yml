name: Bot versus orig
run-name: ai_minimax versus orig — ${{ inputs.games }} games — ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      games:
        description: Total games; must be divisible by four
        required: true
        default: "1000"
      base_seed:
        description: First worker seed
        required: true
        default: "20261001"
      request_id:
        description: Unique ID for matching this launch to its result
        required: false
        default: "manual"

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Ensure fish is available
        run: |
          if ! command -v fish >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y fish
          fi
          fish --version

      - name: Run four alternating-start workers
        env:
          TOTAL_GAMES: ${{ inputs.games }}
          RIG_BASE_SEED: ${{ inputs.base_seed }}
        run: |
          test $((TOTAL_GAMES % 4)) -eq 0
          export RIG_GAMES_PER_WORKER=$((TOTAL_GAMES / 4))
          fish scripts/multi-rig.fish

      - name: Show summary
        if: always()
        run: cat work/latest/summary.csv || true

      - name: Upload result tables and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-vs-orig-${{ github.run_id }}
          path: |
            reports/
            work/latest/
          retention-days: 30
