name: Bot versus orig
run-name: MM-002-RM versus orig — ${{ inputs.games }} alternating-start games

on:
  workflow_dispatch:
    inputs:
      games:
        description: Total games; must be divisible by four
        required: true
        default: "1000"
      base_seed:
        description: First worker seed
        required: true
        default: "20261001"

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build identified bots and rig
        run: make bin/gamerig bin/orig bin/ai_search_start

      - name: Run four alternating-start workers
        env:
          TOTAL_GAMES: ${{ inputs.games }}
          BASE_SEED: ${{ inputs.base_seed }}
        run: |
          test $((TOTAL_GAMES % 4)) -eq 0
          games_per_worker=$((TOTAL_GAMES / 4))
          command="./bin/gamerig -G${games_per_worker} --p0 './bin/ai_search_start --uscale=5 --count-scale=0 --exact-primary=17 --exact-narrow=19 --score-mode=ratio' --p1 ./bin/orig --quiet-bots"
          ./multi-rig.sh "$command" "$BASE_SEED" results

      - name: Show summary
        if: always()
        run: cat results/summary.csv || true

      - name: Upload result tables and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-vs-orig-${{ github.run_id }}
          path: results/
          retention-days: 30
