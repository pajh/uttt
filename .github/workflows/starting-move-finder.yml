name: Starting move finder

on:
  push:
    branches:
      - experiment/starting-moves
  workflow_dispatch:
    inputs:
      games_per_opening:
        description: Games for each of the 81 opening moves
        required: true
        default: "25"
      base_seed:
        description: Seed schedule reused for every opening
        required: true
        default: "20261001"

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Build identified bots and rig
        run: make bin/gamerig bin/orig bin/ai_search_start

      - name: Test every opening on four workers
        run: |
          python3 find-starting-moves.py \
            --games "${{ inputs.games_per_opening }}" \
            --jobs 4 \
            --seed "${{ inputs.base_seed }}" \
            --output starting-moves

      - name: Show results ranked by match score
        if: always()
        run: |
          if test -f starting-moves/summary.csv; then
            python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open("starting-moves/summary.csv")))
          for row in sorted(rows, key=lambda r: float(r["match_score"]), reverse=True):
              print(f"row={row['row']} col={row['col']} grid={row['grid']} cell={row['cell']} orbit={row['orbit']} score={row['match_score']} W/L/D={row['wins']}/{row['losses']}/{row['draws']}")
          PY
          fi

      - name: Upload summary and raw game tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starting-moves-${{ github.run_id }}
          path: starting-moves/
          retention-days: 30
