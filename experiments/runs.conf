# Run from the repository root. Four independent batches, ten games each.
# Current search-from-start bot versus unchanged historical orig.c.
# Scale/argument support is not yet implemented; these measure the current bot.
./bin/gamerig -G10 --p0 ./bin/ai_search_start --p1 ./bin/orig --quiet-bots --seed 20261001 --games-csv "$RUN_OUTPUT/batch-1-games.csv" --moves-csv "$RUN_OUTPUT/batch-1-moves.csv"
